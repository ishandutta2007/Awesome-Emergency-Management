<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Animations -->
    <style>
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.6)); }
        100% { transform: scale(1); opacity: 0.95; }
      }
      @keyframes radar {
        0% { r: 10px; opacity: 1; }
        100% { r: 90px; opacity: 0; }
      }
      .pulse-element {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: 110px 125px;
      }
      .radar-ring {
        animation: radar 4s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
        transform-origin: 110px 125px;
      }
      .radar-ring-delayed {
        animation: radar 4s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
        animation-delay: 2s;
        transform-origin: 110px 125px;
      }
      .text-title {
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        font-size: 36px;
        letter-spacing: 2px;
      }
      .text-subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
        font-size: 16px;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Decorative Grid lines -->
  <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 200 0 L 200 250 M 400 0 L 400 250 M 600 0 L 600 250" stroke="#1e293b" stroke-width="1" />

  <!-- Radar Rings (Dynamic Animations) -->
  <circle cx="110" cy="125" r="40" fill="none" stroke="#ef4444" stroke-width="2" class="radar-ring" />
  <circle cx="110" cy="125" r="40" fill="none" stroke="#f97316" stroke-width="1.5" class="radar-ring-delayed" />
  
  <!-- Hexagon Badge / Icon -->
  <g class="pulse-element">
    <polygon points="110,65 162,95 162,155 110,185 58,155 58,95" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="3" />
    <path d="M110,90 L140,102 L140,135 C140,155 125,168 110,173 C95,168 80,155 80,135 L80,102 Z" fill="#b91c1c" />
    <path d="M110,95 L133,105 L133,135 C133,151 122,162 110,166 C98,162 87,151 87,135 L87,105 Z" fill="#ef4444" />
    <rect x="107" y="110" width="6" height="18" fill="#ffffff" rx="3" />
    <circle cx="110" cy="138" r="3.5" fill="#ffffff" />
  </g>

  <!-- Banner Text -->
  <text x="210" y="120" class="text-title">EMERGENCY MANAGEMENT</text>
  <text x="210" y="155" class="text-subtitle">Curated Platform List &amp; Open-Source Alternatives</text>
  
  <!-- Glowing Overlay lines -->
  <path d="M 210 175 L 680 175" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  
</svg>
